<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaSElephant — Software Directory</title>
<meta name="description" content="Discover software for business, marketing, finance, design, HR, security and IT.">
<style>
:root{--ink:#172033;--muted:#667085;--line:#e6e8ec;--blue:#1769e0;--soft:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);line-height:1.55}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.nav{border-bottom:1px solid var(--line);padding:18px 24px;position:sticky;top:0;background:#fff}.navin,.wrap,footer div{max-width:1180px;margin:auto}.brand{font-size:22px;font-weight:750;color:var(--ink)}.brand span{font-weight:400}.wrap{padding:45px 24px}.eyebrow{text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--blue)}h1{font-size:42px;line-height:1.12;margin:10px 0}.lead{font-size:18px;color:var(--muted);max-width:760px}.search{display:flex;gap:10px;margin:26px 0}.search input{flex:1;padding:14px;border:1px solid #ccd2db;border-radius:8px;font-size:16px}.btn{background:var(--blue);color:white;border:0;border-radius:8px;padding:13px 20px;font-weight:700}.section{border-top:1px solid var(--line);padding:34px 0}.catlist{display:grid;grid-template-columns:1fr 1fr;gap:0 55px}.cat,.software{padding:18px 0;border-bottom:1px solid var(--line)}.cat a{font-size:18px;font-weight:650}.cat p,.software p{margin:5px 0;color:var(--muted);font-size:14px}.software h3{margin:0;font-size:20px}.vendor{font-size:13px;color:var(--muted)}.tag{display:inline-block;background:var(--soft);padding:3px 8px;border-radius:5px;margin:3px 5px 0 0;font-size:12px}.meta{font-size:13px;color:var(--muted);margin-top:8px}.back{margin-bottom:25px;font-size:14px}.profile{max-width:850px}.box{border-top:1px solid var(--line);padding:22px 0}.box h3{text-transform:uppercase;font-size:14px;letter-spacing:.8px}.affiliate{background:var(--soft);border:1px solid var(--line);padding:20px;border-radius:10px}.cta{display:inline-block;background:var(--blue);color:#fff;padding:12px 18px;border-radius:7px;font-weight:700}.notice{font-size:12px;color:var(--muted);margin-top:10px}footer{border-top:1px solid var(--line);margin-top:40px}footer div{padding:24px;color:var(--muted);font-size:13px}@media(max-width:700px){.catlist{grid-template-columns:1fr}h1{font-size:34px}.wrap{padding:32px 18px}.search{display:block}.search .btn{margin-top:8px;width:100%}}
</style></head><body>
<div class="nav"><div class="navin"><a class="brand" href="./">SaaS<span>Elephant</span></a></div></div>
<main class="wrap" id="app"></main><footer><div>© 2026 SaaSElephant · Software discovery and affiliate directory</div></footer>
<script>
const cats=[['CAT001','Business & Productivity','Manage work, teams, projects, and everyday business tasks.'],['CAT002','Marketing & Sales','Find tools for marketing, customers, sales, and growth.'],['CAT003','Finance & Accounting','Manage accounting, expenses, billing, taxes, and finances.'],['CAT004','Design & Creative','Create designs, graphics, videos, presentations, and more.'],['CAT005','HR & Operations','Manage people, payroll, performance, time, and operations.'],['CAT006','Security & IT','Protect data, manage IT, secure systems, and support users.']];
const software=[
['SE001','HubSpot','CRM and marketing software for managing customers, sales, and growth.','CRM & Lead Management','CRM; Marketing Automation; Sales; Customer Service; Analytics','CRM, Marketing Automation, Sales, Customer Service, Analytics','https://www.hubspot.com'],
['SE002','Pipedrive','Sales CRM software for managing leads, deals, pipelines, and customer relationships.','CRM & Lead Management','Sales CRM; Lead Management; Pipeline Management; Sales Automation; Reporting','Sales teams and small businesses','https://www.pipedrive.com'],
['SE003','ClickUp','Productivity software for managing projects, tasks, teams, and workflows.','Manage Projects & Teams','Project Management; Task Management; Collaboration; Documents; Automation','Teams and businesses','https://clickup.com'],
['SE004','monday.com','Work management software for projects, teams, workflows, and business operations.','Manage Projects & Teams','Project Management; Work Management; CRM; Automation; Collaboration','Teams and businesses','https://monday.com'],
['SE005','Notion','Workspace software for notes, documents, knowledge, projects, and collaboration.','Documents & Collaboration','Documents; Knowledge Management; Project Management; Collaboration; AI','Individuals and teams','https://www.notion.com'],
['SE006','Zapier','Automation software for connecting apps and automating repetitive workflows.','Workflow & Automation','Workflow Automation; App Integrations; Task Automation; AI Automation','Businesses and teams','https://zapier.com'],
['SE007','Semrush','Digital marketing software for SEO, content, advertising, and competitive research.','SEO & Content','SEO; Keyword Research; Competitive Research; Content Marketing; Analytics','Marketing teams and agencies','https://www.semrush.com'],
['SE008','ActiveCampaign','Marketing automation software for email marketing, CRM, and customer engagement.','Email Marketing','Email Marketing; Marketing Automation; CRM; Customer Engagement; AI','Small and growing businesses','https://www.activecampaign.com'],
['SE009','GetResponse','Email marketing and automation software for growing businesses and online marketers.','Email Marketing','Email Marketing; Marketing Automation; Landing Pages; Lead Generation; Webinars','Marketers and small businesses','https://www.getresponse.com'],
['SE010','Canva','Design software for creating graphics, presentations, documents, videos, and marketing content.','Graphic Design','Graphic Design; Presentations; Video; Templates; Brand Design','Individuals, teams, and businesses','https://www.canva.com'],
['SE011','FreshBooks','Accounting and invoicing software for small businesses and self-employed professionals.','Accounting Software','Invoicing; Accounting; Expenses; Payments; Time Tracking','Small businesses and freelancers','https://www.freshbooks.com'],
['SE012','1Password','Password management software for securely protecting business and personal credentials.','Identity & Access Management','Password Management; Security; Secrets Management; Access Control','Individuals, teams, and businesses','https://1password.com']];
function list(items){return items.map(s=>`<article class="software"><h3><a href="?software=${s[0]}">${s[1]}</a></h3><div class="vendor">${s[0]}</div><p>${s[2]}</p><div>${s[4].split('; ').map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="meta">Best for: ${s[5]}</div></article>`).join('')}
function home(){app.innerHTML=`<section><div class="eyebrow">Software directory</div><h1>Find the right software for your business.</h1><p class="lead">Explore software by category, see what each tool is built for, and visit the vendor when you are ready to learn more.</p><div class="search"><input id="q" placeholder="Search software by name, feature, or category"><button class="btn" onclick="search()">Search</button></div></section><section class="section"><h2>Software Categories</h2><p class="lead" style="font-size:15px">Browse software by what it helps you do.</p><div class="catlist">${cats.map(c=>`<div class="cat"><a href="?category=${encodeURIComponent(c[1])}">${c[1]}</a><p>${c[2]}</p></div>`).join('')}</div></section><section class="section"><h2>Software</h2><div id="results">${list(software)}</div></section>`}function search(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('results').innerHTML=list(software.filter(s=>(s[1]+' '+s[2]+' '+s[3]+' '+s[4]+' '+s[5]).toLowerCase().includes(q)))}function profile(id){const s=software.find(x=>x[0]===id);if(!s)return false;app.innerHTML=`<section class="profile"><div class="back"><a href="./">← Back to directory</a></div><div class="eyebrow">Software profile</div><h1>${s[1]}</h1><div class="vendor">${s[0]}</div><div class="box"><p>${s[2]}</p></div><div class="box"><h3>Best for</h3><p>${s[5]}</p></div><div class="box"><h3>Key features</h3><p>${s[4].split('; ').map(x=>`<span class="tag">${x}</span>`).join('')}</p></div><div class="box"><h3>Category</h3><p><a href="?category=${encodeURIComponent(s[3])}">${s[3]}</a></p></div><div class="affiliate"><strong>Explore ${s[1]}</strong><p>Visit the vendor to learn more and choose the plan that fits your needs.</p><a class="cta" href="${s[6]}" target="_blank" rel="sponsored noopener">Visit ${s[1]}</a><div class="notice">SaaSElephant may earn a commission when you use qualifying affiliate links.</div></div></section>`;return true}function category(name){const items=software.filter(s=>s[3]===name);if(!items.length)return false;app.innerHTML=`<section><div class="back"><a href="./">← Back to directory</a></div><div class="eyebrow">Category</div><h1>${name}</h1><p class="lead">Software listed in this category.</p><section class="section"><div>${list(items)}</div></section></section>`;return true}const p=new URLSearchParams(location.search);if(p.has('software')&&!profile(p.get('software')))home();else if(p.has('category')&&!category(p.get('category')))home();else if(!p.has('software')&&!p.has('category'))home();
</script></body></html>
