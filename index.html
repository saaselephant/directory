<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaSElephant — Find Software for Your Business</title>
<meta name="description" content="Discover and compare software across business, marketing, finance, design, HR, security and IT categories.">

<style>
:root{
  --ink:#102347;--muted:#66748c;--blue:#1769e8;--blue2:#2f7bf0;
  --navy:#102a55;--paper:#f6f9fd;--white:#fff;--line:#e3e9f2;
  --soft:#edf4ff;--max:1220px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.nav{max-width:var(--max);margin:auto;padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:850;letter-spacing:-1px;color:var(--navy)}
.brandmark{width:43px;height:36px;object-fit:contain;object-position:center;flex:none}
.brand span{color:var(--blue);font-weight:650}
.navlinks{display:flex;align-items:center;gap:28px;font-size:14px;font-weight:700;color:#344765}
.navlinks a:hover{color:var(--blue)}
.nav-cta{background:var(--navy);color:#fff!important;padding:10px 17px;border-radius:9px}
.wrap{max-width:var(--max);margin:auto;padding:0 26px}

.hero{position:relative;overflow:hidden;padding:68px 0 32px;background:linear-gradient(135deg,#fbfdff 0%,#eef5ff 58%,#fff 100%);border-bottom:1px solid var(--line)}
.hero:after{content:"";position:absolute;right:-90px;top:10px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#dfeeff 0%,rgba(223,238,255,0) 70%);pointer-events:none}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:52% 48%;align-items:center;min-height:465px}
.hero-copy{padding:10px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:12px;font-weight:850;letter-spacing:1.6px;text-transform:uppercase}
.eyebrow:before{content:"";width:24px;height:2px;background:var(--blue);border-radius:2px}
h1{font-size:58px;line-height:1.02;letter-spacing:-2.8px;margin:15px 0 18px;max-width:700px}
.hero h1 .accent{color:var(--blue)}
.lead{font-size:18px;color:#52627b;max-width:650px;margin:0}
.search{display:flex;max-width:720px;margin-top:28px;box-shadow:0 12px 34px rgba(16,42,85,.10)}
.search input{min-width:0;flex:1;padding:17px 19px;border:1px solid #cbd6e6;border-right:0;border-radius:11px 0 0 11px;outline:none;background:#fff}
.search input:focus{border-color:var(--blue)}
.search button{border:0;background:var(--blue);color:#fff;padding:0 28px;border-radius:0 11px 11px 0;font-weight:800;cursor:pointer}
.search button:hover{background:#0f57c9}
.popular{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}
.popular b{color:var(--navy);margin-right:2px}
.pill{border:1px solid #d9e2ef;background:#fff;border-radius:999px;padding:6px 11px;color:#28466f}
.hero-art{position:relative;min-height:455px;display:flex;align-items:center;justify-content:center}
.elephant-scene{position:relative;width:100%;height:455px}
.mountain{position:absolute;inset:auto 0 35px 0;height:210px;background:linear-gradient(145deg,transparent 34%,#a8c1df 35%,#dce9f7 55%,transparent 56%);opacity:.65;clip-path:polygon(0 100%,18% 48%,28% 72%,43% 20%,56% 67%,70% 36%,82% 70%,100% 35%,100% 100%)}
.elephant-svg{position:absolute;width:440px;height:auto;right:28px;bottom:36px;filter:drop-shadow(0 20px 22px rgba(16,42,85,.18))}
.app-orb{position:absolute;width:60px;height:60px;border-radius:14px;background:#fff;border:1px solid #e0e7f0;box-shadow:0 10px 24px rgba(16,42,85,.12);display:grid;place-items:center;font-weight:900;color:var(--blue);font-size:20px}
.orb1{top:78px;left:30px}.orb2{top:38px;right:32px}.orb3{top:190px;left:0}.orb4{right:0;top:235px}.orb5{bottom:62px;left:95px}
.scene-note{position:absolute;left:72px;bottom:45px;background:#fff;border:1px solid #dce5f1;border-radius:15px;padding:14px 19px;box-shadow:0 12px 28px rgba(16,42,85,.12);display:flex;align-items:center;gap:11px;font-size:14px;font-weight:800;color:var(--navy)}
.scene-note small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.scene-icon{width:38px;height:38px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff}

.stats{position:relative;z-index:4;margin-top:-5px}
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 28px rgba(16,42,85,.09);overflow:hidden}
.stat{padding:20px 25px;display:flex;align-items:center;gap:14px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}.stat-icon{width:43px;height:43px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--blue);font-size:21px;font-weight:900}.stat strong{display:block;font-size:24px;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}

.section{padding:54px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
.section h2{font-size:27px;letter-spacing:-.8px;margin:0}.section-sub{margin:5px 0 0;color:var(--muted);font-size:14px}.count{font-size:13px;color:var(--muted);white-space:nowrap}
.viewall{color:var(--blue);font-size:13px;font-weight:750}.viewall:hover{text-decoration:underline}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.cat{padding:21px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 4px 15px rgba(16,42,85,.045);transition:.18s}
.cat:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,42,85,.09);border-color:#cbdcf7}
.cat-top{display:flex;align-items:center;gap:13px}.cat-icon{width:43px;height:43px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--blue);font-size:20px;font-weight:900}.cat a{font-size:17px;font-weight:800;color:var(--navy)}.cat a:hover{color:var(--blue)}.cat p{margin:8px 0 0;color:var(--muted);font-size:13px}.cat-arrow{margin-left:auto;color:#8190a6;font-size:20px}

.directory{background:var(--paper);border-top:1px solid #edf1f6}
.software-list{display:grid;gap:11px}
.software{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px;display:flex;justify-content:space-between;gap:20px;box-shadow:0 3px 12px rgba(16,42,85,.035)}
.software-main{min-width:0}.software h3{margin:0;font-size:16px}.software h3 a{color:var(--blue)}.software h3 a:hover{text-decoration:underline}.vendor{font-size:12px;color:#71809a;margin-top:2px}.software p{margin:7px 0 0;font-size:13px;color:#4f607a}.meta{font-size:11px;color:#7a879a;margin-top:7px}.meta a{color:var(--blue)}.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-content:flex-start;max-width:300px}.tag{background:#f0f5fd;color:#4c6a97;border-radius:999px;padding:4px 8px;font-size:10px}

.profile{padding:48px 0 70px;max-width:850px}.back{margin-bottom:22px}.back a{color:var(--blue);font-size:13px;font-weight:700}.profile h1{font-size:46px;margin:10px 0 4px}.profile .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}.profile .box h3{margin:0 0 7px;font-size:15px}.profile .box p{margin:0;color:#53627a;font-size:14px}.profile-tags .tag{display:inline-block;margin:3px}.affiliate{margin-top:18px;background:linear-gradient(135deg,#edf5ff,#fff);border:1px solid #cfe0fa;border-radius:16px;padding:23px}.affiliate strong{font-size:18px}.affiliate p{color:var(--muted);font-size:13px}.cta{display:inline-block;background:var(--navy);color:#fff;padding:12px 19px;border-radius:9px;font-weight:800;margin-top:5px}.cta:hover{background:#183c72}.notice{margin-top:12px;font-size:11px;color:#71809a}.status{padding:35px 0;color:var(--muted)}
footer{background:var(--navy);color:#dbe6f7}.footerin{max-width:var(--max);margin:auto;padding:25px 26px;display:flex;justify-content:space-between;gap:20px;font-size:12px}.footerbrand{font-weight:800;color:#fff}

@media(max-width:900px){
 .hero-grid{grid-template-columns:1fr}.hero-art{min-height:360px}.elephant-scene{height:360px}.elephant-svg{width:360px;height:auto;right:50%;transform:translateX(50%)}.scene-note{left:15px;bottom:15px}.orb1{left:20px}.orb2{right:10px}
 h1{font-size:45px}.categories{grid-template-columns:repeat(2,1fr)}.statsbar{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media(max-width:620px){
 .nav{padding:12px 16px}.navlinks a:not(.nav-cta){display:none}.navlinks{gap:8px}.nav-cta{padding:8px 11px}.wrap{padding:0 16px}
 .hero{padding:42px 0 20px}.hero-grid{min-height:0}.hero-art{min-height:310px}.elephant-scene{height:310px}.elephant-svg{width:305px;height:auto}.app-orb{width:48px;height:48px;font-size:15px}.scene-note{font-size:12px}
 h1{font-size:38px;letter-spacing:-1.8px}.lead{font-size:16px}.search input{padding:14px}.search button{padding:0 18px}.categories{grid-template-columns:1fr}.statsbar{grid-template-columns:1fr}.stat{border-right:0!important;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.software{display:block}.chips{justify-content:flex-start;max-width:none;margin-top:10px}.footerin{display:block}.footerin div+div{margin-top:8px}
}
</style>

</head>

<script>
const SUPABASE_URL="https://gwdpcrmivoehkjlauqfi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_CaeRqOwr9kQXL6pf02Y8GQ_yAtGPqjy";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cats=[],software=[],relations=[],affiliates=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tags(v){return String(v||"").split(";").map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}
function catById(id){return cats.find(c=>c.category_id===id)}
function categoriesForSoftware(id){return relations.filter(r=>r.software_id===id).map(r=>catById(r.category_id)).filter(Boolean)}
function primaryCategory(id){const r=relations.find(x=>x.software_id===id&&x.primary_category);return r?catById(r.category_id):categoriesForSoftware(id)[0]}
function affiliateFor(id){return affiliates.find(a=>a.software_id===id&&a.status==="Active")}
function softwareList(items){return items.map(s=>{const pc=primaryCategory(s.software_id);return `<article class="software"><div class="software-main"><h3><a href="?software=${encodeURIComponent(s.software_id)}">${esc(s.software_name)}</a></h3><div class="vendor">${esc(s.vendor)}</div><p>${esc(s.short_description)}</p><div class="meta">Best for: ${esc(s.best_for||"Businesses and teams")}${pc?` · Category: <a href="?category=${encodeURIComponent(pc.category_id)}">${esc(pc.category_name)}</a>`:""}</div></div><div class="chips">${tags(s.key_features)}</div></article>`}).join("")}
function home(){app.innerHTML=`<section class="hero"><div class="wrap"><div class="hero-inner"><div class="eyebrow">Software discovery</div><h1>Find software that fits the way you work.</h1><p class="lead">Explore trusted software by category, understand what each tool is built for, and visit the vendor when you're ready to take the next step.</p><div class="search"><input id="q" placeholder="Search software, features, or categories" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Search</button></div></div></div></section><section class="section" id="categories"><div class="wrap"><div class="section-head"><div><h2>Browse software categories</h2><p class="section-sub">Start with what you need to accomplish.</p></div><div class="count">${cats.filter(c=>c.level===1).length} categories</div></div><div class="categories">${cats.filter(c=>c.level===1).map(c=>`<div class="cat"><a href="?category=${encodeURIComponent(c.category_id)}">${esc(c.category_name)}</a><p>${esc(c.description)}</p></div>`).join("")}</div></div></section><section class="section directory"><div class="wrap"><div class="section-head"><div><h2>Software directory</h2><p class="section-sub">Explore the tools currently listed on SaaSElephant.</p></div><div class="count">${software.length} software</div></div><div class="software-list" id="results">${softwareList(software)}</div></div></section>`}
function search(){const q=(document.getElementById("q").value||"").toLowerCase().trim();const results=software.filter(s=>{const names=categoriesForSoftware(s.software_id).map(c=>c.category_name).join(" ");return [s.software_name,s.vendor,s.short_description,s.full_description,s.best_for,s.key_features,s.pricing,names].join(" ").toLowerCase().includes(q)});document.getElementById("results").innerHTML=results.length?softwareList(results):`<div class="status">No software matched your search.</div>`}
function profile(id){const s=software.find(x=>x.software_id===id);if(!s)return false;const catsFor=categoriesForSoftware(id);const a=affiliateFor(id);const destination=a&&a.affiliate_url&&!a.affiliate_url.startsWith("Generated")?a.affiliate_url:s.website_url;app.innerHTML=`<div class="wrap"><section class="profile"><div class="back"><a href="./">← Back to software directory</a></div><div class="eyebrow">Software profile</div><h1>${esc(s.software_name)}</h1><div class="vendor">${esc(s.vendor)}</div><div class="box"><p>${esc(s.full_description||s.short_description)}</p></div><div class="box"><h3>Best for</h3><p>${esc(s.best_for||"Businesses and teams")}</p></div><div class="box profile-tags"><h3>Key features</h3><p>${tags(s.key_features)}</p></div><div class="box"><h3>Pricing</h3><p>${esc(s.pricing||"See vendor for current pricing.")}</p><p class="meta" style="margin-top:8px">${s.free_plan?"Free plan available":"No free plan listed"} · ${s.free_trial?"Free trial available":"No free trial listed"}</p></div><div class="box"><h3>Categories</h3><p>${catsFor.map(c=>`<a href="?category=${encodeURIComponent(c.category_id)}" style="color:var(--blue)">${esc(c.category_name)}</a>`).join(" · ")||"Uncategorized"}</p></div><div class="affiliate"><strong>Explore ${esc(s.software_name)}</strong><p>Visit the vendor to learn more and choose the plan that fits your needs.</p><a class="cta" href="${esc(destination)}" target="_blank" rel="sponsored noopener">Visit ${esc(s.software_name)}</a><div class="notice">SaaSElephant may earn a commission when you use qualifying affiliate links.</div></div></section></div>`;return true}
function category(id){const c=catById(id);if(!c){app.innerHTML=`<div class="wrap"><section class="profile"><div class="back"><a href="./">← Back to directory</a></div><h1>Category not found</h1><p class="lead">This category could not be found in the directory.</p></section></div>`;return}const childCats=cats.filter(x=>x.parent_category_id===id);const ids=new Set([id,...childCats.map(x=>x.category_id)]);const items=software.filter(s=>relations.some(r=>r.software_id===s.software_id&&ids.has(r.category_id)));app.innerHTML=`<div class="wrap"><section class="profile"><div class="back"><a href="./">← Back to directory</a></div><div class="eyebrow">Software category</div><h1>${esc(c.category_name)}</h1><p class="lead">${esc(c.description||"Software listed in this category.")}</p>${childCats.length?`<div class="box"><h3>Subcategories</h3><p>${childCats.map(x=>`<a href="?category=${encodeURIComponent(x.category_id)}" style="color:var(--blue);display:block;margin:7px 0">${esc(x.category_name)} <span style="color:var(--muted)">— ${esc(x.description||"")}</span></a>`).join("")}</p></div>`:""}<div class="box"><h3>Software</h3><div class="software-list">${items.length?softwareList(items):`<div class="status">No software is currently listed in this category.</div>`}</div></div></section></div>`}
async function load(){const [c,s,r,a]=await Promise.all([db.from("categories").select("*").eq("status","Active").order("level").order("category_name"),db.from("software").select("*").eq("status","Candidate").order("software_name"),db.from("software_categories").select("*"),db.from("affiliate_programs").select("*")]);const errors=[c,s,r,a].filter(x=>x.error);if(errors.length)throw errors[0].error;cats=c.data||[];software=s.data||[];relations=r.data||[];affiliates=a.data||[];const p=new URLSearchParams(location.search);if(p.has("software")){if(!profile(p.get("software")))home();return}if(p.has("category")){category(p.get("category"));return}home()}
load().catch(err=>{console.error(err);app.innerHTML=`<div class="wrap"><section class="profile"><div class="eyebrow">Software directory</div><h1>We’re updating the directory.</h1><p class="lead">The software database could not be loaded right now. Please try again shortly.</p></section></div>`});
</script>
