<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaaSElephant — Find Software for Your Business</title>
<meta name="description" content="Discover and compare software across business, marketing, finance, design, HR, security and IT categories.">
<style>
:root{--ink:#142033;--muted:#667085;--blue:#1769e0;--blue-dark:#0f4fb5;--navy:#10233f;--paper:#f7f9fc;--white:#fff;--line:#e5e9f0;--chip:#eef4ff;--max:1160px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}button,input{font:inherit}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.nav{max-width:var(--max);margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:24px;font-weight:850;letter-spacing:-.7px}.brand span{font-weight:450}.navlinks{display:flex;gap:24px;font-size:14px;font-weight:650;color:#46546a}.navlinks a:hover{color:var(--blue)}
.wrap{max-width:var(--max);margin:auto;padding:0 24px}.hero{padding:72px 0 54px;background:linear-gradient(180deg,#f8fbff 0%,#fff 100%);border-bottom:1px solid var(--line)}.hero-inner{max-width:820px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.eyebrow:before{content:"";width:24px;height:2px;background:var(--blue);border-radius:2px}h1{font-size:52px;line-height:1.04;letter-spacing:-2px;margin:14px 0 18px;max-width:760px}.lead{font-size:18px;color:var(--muted);max-width:720px;margin:0}.search{display:flex;max-width:760px;margin-top:30px;box-shadow:0 10px 30px rgba(16,35,63,.08)}.search input{min-width:0;flex:1;padding:17px 18px;border:1px solid #cfd7e3;border-right:0;border-radius:10px 0 0 10px;outline:none;background:#fff}.search input:focus{border-color:var(--blue)}.search button{border:0;background:var(--blue);color:#fff;padding:0 25px;border-radius:0 10px 10px 0;font-weight:750;cursor:pointer}.search button:hover{background:var(--blue-dark)}
.section{padding:54px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.section h2{font-size:27px;letter-spacing:-.7px;margin:0}.section-sub{margin:5px 0 0;color:var(--muted);font-size:14px}.count{font-size:13px;color:var(--muted);white-space:nowrap}
.categories{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line)}.cat{padding:22px 20px 22px 0;border-bottom:1px solid var(--line);margin-right:30px}.cat:nth-child(even){padding-left:30px;border-left:1px solid var(--line);margin-right:0}.cat a{font-size:18px;font-weight:760;color:var(--blue)}.cat a:hover{text-decoration:underline}.cat p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:520px}
.directory{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.software-list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.software{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:21px 24px;border-bottom:1px solid var(--line)}.software:last-child{border-bottom:0}.software:hover{background:#fbfcff}.software-main h3{margin:0;font-size:18px;letter-spacing:-.2px}.software-main h3 a{color:var(--blue)}.software-main h3 a:hover{text-decoration:underline}.vendor{margin-top:3px;color:#7a8698;font-size:12px}.software-main p{margin:7px 0 8px;color:var(--muted);font-size:14px}.meta{font-size:12px;color:#7a8698}.meta a{color:var(--blue)}.chips{text-align:right;max-width:300px}.tag{display:inline-block;background:var(--chip);color:#3d5f94;padding:4px 8px;border-radius:999px;font-size:11px;margin:2px}.status{padding:30px;color:var(--muted);text-align:center}
.profile{max-width:850px;padding:54px 0 70px}.back{font-size:13px;color:var(--blue);font-weight:650;margin-bottom:28px}.profile h1{font-size:46px;margin-bottom:7px}.profile .vendor{font-size:13px}.box{padding:25px 0;border-top:1px solid var(--line)}.box h3{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;margin:0 0 8px}.box p{margin:0;color:var(--muted)}.profile-tags .tag{font-size:12px}.affiliate{margin-top:12px;background:var(--navy);color:#fff;border-radius:14px;padding:28px}.affiliate strong{font-size:20px}.affiliate p{color:#cbd6e6;margin:6px 0 18px}.cta{display:inline-block;background:#fff;color:var(--navy);padding:12px 18px;border-radius:8px;font-weight:800}.notice{font-size:11px;color:#aebbd0;margin-top:12px}
footer{background:var(--navy);color:#b8c5d8}.footerin{max-width:var(--max);margin:auto;padding:30px 24px;font-size:12px;display:flex;justify-content:space-between;gap:20px}.footerbrand{color:#fff;font-weight:800}
@media(max-width:760px){.nav{padding:14px 18px}.navlinks{display:none}.wrap{padding:0 18px}.hero{padding:48px 0 42px}h1{font-size:39px;letter-spacing:-1.4px}.search{display:flex}.search input{font-size:14px;padding:15px 13px}.search button{padding:0 16px}.categories{grid-template-columns:1fr}.cat,.cat:nth-child(even){padding:18px 0;margin:0;border-left:0}.software{grid-template-columns:1fr;padding:18px}.chips{text-align:left;max-width:none}.section{padding:42px 0}.profile{padding:42px 0 55px}.profile h1{font-size:38px}.footerin{display:block}.footerin div+div{margin-top:8px}}
</style>
</head>
<body>
<header class="header"><nav class="nav"><a class="brand" href="./">SaaS<span>Elephant</span></a><div class="navlinks"><a href="./">Browse Software</a><a href="#categories">Categories</a></div></nav></header>
<main id="app"><div class="status">Loading software directory…</div></main>
<footer><div class="footerin"><div><span class="footerbrand">SaaSElephant</span> · Software discovery and affiliate directory</div><div>© 2026 SaaSElephant</div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://gwdpcrmivoehkjlauqfi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_CaeRqOwr9kQXL6pf02Y8GQ_yAtGPqjy";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cats=[],software=[],relations=[],affiliates=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tags(v){return String(v||"").split(";").map(x=>x.trim()).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}
function catById(id){return cats.find(c=>c.category_id===id)}
function categoriesForSoftware(id){return relations.filter(r=>r.software_id===id).map(r=>catById(r.category_id)).filter(Boolean)}
function primaryCategory(id){const r=relations.find(x=>x.software_id===id&&x.primary_category);return r?catById(r.category_id):categoriesForSoftware(id)[0]}
function affiliateFor(id){return affiliates.find(a=>a.software_id===id&&a.status==="Active")}
function softwareList(items){return items.map(s=>{const pc=primaryCategory(s.software_id);return `<article class="software"><div class="software-main"><h3><a href="?software=${encodeURIComponent(s.software_id)}">${esc(s.software_name)}</a></h3><div class="vendor">${esc(s.vendor)}</div><p>${esc(s.short_description)}</p><div class="meta">Best for: ${esc(s.best_for||"Businesses and teams")}${pc?` · Category: <a href="?category=${encodeURIComponent(pc.category_id)}">${esc(pc.category_name)}</a>`:""}</div></div><div class="chips">${tags(s.key_features)}</div></article>`}).join("")}
function home(){app.innerHTML=`<section class="hero"><div class="wrap"><div class="hero-inner"><div class="eyebrow">Software discovery</div><h1>Find software that fits the way you work.</h1><p class="lead">Explore trusted software by category, understand what each tool is built for, and visit the vendor when you're ready to take the next step.</p><div class="search"><input id="q" placeholder="Search software, features, or categories" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Search</button></div></div></div></section><section class="section" id="categories"><div class="wrap"><div class="section-head"><div><h2>Browse software categories</h2><p class="section-sub">Start with what you need to accomplish.</p></div><div class="count">${cats.filter(c=>c.level===1).length} categories</div></div><div class="categories">${cats.filter(c=>c.level===1).map(c=>`<div class="cat"><a href="?category=${encodeURIComponent(c.category_id)}">${esc(c.category_name)}</a><p>${esc(c.description)}</p></div>`).join("")}</div></div></section><section class="section directory"><div class="wrap"><div class="section-head"><div><h2>Software directory</h2><p class="section-sub">Explore the tools currently listed on SaaSElephant.</p></div><div class="count">${software.length} software</div></div><div class="software-list" id="results">${softwareList(software)}</div></div></section>`}
function search(){const q=(document.getElementById("q").value||"").toLowerCase().trim();const results=software.filter(s=>{const names=categoriesForSoftware(s.software_id).map(c=>c.category_name).join(" ");return [s.software_name,s.vendor,s.short_description,s.full_description,s.best_for,s.key_features,s.pricing,names].join(" ").toLowerCase().includes(q)});document.getElementById("results").innerHTML=results.length?softwareList(results):`<div class="status">No software matched your search.</div>`}
function profile(id){const s=software.find(x=>x.software_id===id);if(!s)return false;const catsFor=categoriesForSoftware(id);const a=affiliateFor(id);const destination=a&&a.affiliate_url&&!a.affiliate_url.startsWith("Generated")?a.affiliate_url:s.website_url;app.innerHTML=`<div class="wrap"><section class="profile"><div class="back"><a href="./">← Back to software directory</a></div><div class="eyebrow">Software profile</div><h1>${esc(s.software_name)}</h1><div class="vendor">${esc(s.vendor)}</div><div class="box"><p>${esc(s.full_description||s.short_description)}</p></div><div class="box"><h3>Best for</h3><p>${esc(s.best_for||"Businesses and teams")}</p></div><div class="box profile-tags"><h3>Key features</h3><p>${tags(s.key_features)}</p></div><div class="box"><h3>Pricing</h3><p>${esc(s.pricing||"See vendor for current pricing.")}</p><p class="meta" style="margin-top:8px">${s.free_plan?"Free plan available":"No free plan listed"} · ${s.free_trial?"Free trial available":"No free trial listed"}</p></div><div class="box"><h3>Categories</h3><p>${catsFor.map(c=>`<a href="?category=${encodeURIComponent(c.category_id)}" style="color:var(--blue)">${esc(c.category_name)}</a>`).join(" · ")||"Uncategorized"}</p></div><div class="affiliate"><strong>Explore ${esc(s.software_name)}</strong><p>Visit the vendor to learn more and choose the plan that fits your needs.</p><a class="cta" href="${esc(destination)}" target="_blank" rel="sponsored noopener">Visit ${esc(s.software_name)}</a><div class="notice">SaaSElephant may earn a commission when you use qualifying affiliate links.</div></div></section></div>`;return true}
function category(id){const c=catById(id);if(!c){app.innerHTML=`<div class="wrap"><section class="profile"><div class="back"><a href="./">← Back to directory</a></div><h1>Category not found</h1><p class="lead">This category could not be found in the directory.</p></section></div>`;return}const childCats=cats.filter(x=>x.parent_category_id===id);const ids=new Set([id,...childCats.map(x=>x.category_id)]);const items=software.filter(s=>relations.some(r=>r.software_id===s.software_id&&ids.has(r.category_id)));app.innerHTML=`<div class="wrap"><section class="profile"><div class="back"><a href="./">← Back to directory</a></div><div class="eyebrow">Software category</div><h1>${esc(c.category_name)}</h1><p class="lead">${esc(c.description||"Software listed in this category.")}</p>${childCats.length?`<div class="box"><h3>Subcategories</h3><p>${childCats.map(x=>`<a href="?category=${encodeURIComponent(x.category_id)}" style="color:var(--blue);display:block;margin:7px 0">${esc(x.category_name)} <span style="color:var(--muted)">— ${esc(x.description||"")}</span></a>`).join("")}</p></div>`:""}<div class="box"><h3>Software</h3><div class="software-list">${items.length?softwareList(items):`<div class="status">No software is currently listed in this category.</div>`}</div></div></section></div>`}
async function load(){const [c,s,r,a]=await Promise.all([db.from("categories").select("*").eq("status","Active").order("level").order("category_name"),db.from("software").select("*").eq("status","Candidate").order("software_name"),db.from("software_categories").select("*"),db.from("affiliate_programs").select("*")]);const errors=[c,s,r,a].filter(x=>x.error);if(errors.length)throw errors[0].error;cats=c.data||[];software=s.data||[];relations=r.data||[];affiliates=a.data||[];const p=new URLSearchParams(location.search);if(p.has("software")){if(!profile(p.get("software")))home();return}if(p.has("category")){category(p.get("category"));return}home()}
load().catch(err=>{console.error(err);app.innerHTML=`<div class="wrap"><section class="profile"><div class="eyebrow">Software directory</div><h1>We’re updating the directory.</h1><p class="lead">The software database could not be loaded right now. Please try again shortly.</p></section></div>`});
</script>
</body>
</html>
